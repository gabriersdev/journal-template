services:
  ghost:
    image: ghost:latest
    restart: always
    ports:
      - "2368:2368"
    environment:
      # Modo de desenvolvimento para facilitar o debug
      NODE_ENV: development
      url: http://localhost:2368
    volumes:
      # Isso mapeia a pasta atual (o seu tema) para dentro do Ghost!
      - ./:/var/lib/ghost/content/themes/escudo
